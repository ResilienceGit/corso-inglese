<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyEnglish · Gestionale</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/site/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 6h32a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H24l-10 8v-8H8a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Z" fill="#ffd23f"/><path d="M17 14h14M17 22h10M17 30h14M17 14v16" stroke="#14103a" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>EasyEnglish</div>
    <h1>Area gestionale</h1>
    <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn" type="submit">Entra</button>
    <p class="err" id="login-err" role="alert"></p>
    <p class="hint">Demo: password <code>easyenglish</code></p>
    <a class="back" href="/site/">← Torna al sito</a>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 6h32a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H24l-10 8v-8H8a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Z" fill="#ffd23f"/><path d="M17 14h14M17 22h10M17 30h14M17 14v16" stroke="#14103a" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>EasyEnglish</div>
    <nav id="nav" aria-label="Sezioni"></nav>
    <div class="side-foot"><a href="/site/" target="_blank" rel="noopener">Vedi il sito ↗</a><button id="logout" class="link">Esci</button></div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
